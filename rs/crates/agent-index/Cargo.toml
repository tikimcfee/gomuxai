[package]
name = "agent-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Sessions (docs/INDEX-V2.md, "Sessions as full text"): read through the
# transcript event model, scrubbed by the dreams' scrubber.
agent-transcript.workspace = true
agent-dream.workspace = true
anyhow.workspace = true
chrono.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Git blob ids, for the search's stale check (a file's key is its blob id).
sha1_smol.workspace = true
postgres.workspace = true
toml.workspace = true
ureq.workspace = true

# The embedder (docs/INDEX.md, "Embeddings"): bge-small-en-v1.5 on the CPU,
# pure Rust (candle), no ONNX Runtime. Off by default: the index works
# without vectors, and search fuses the lists it has.
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
half = { version = "2", optional = true }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["fancy-regex"] }

# The file watcher's inotify (agent index watch).
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[features]
embed = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:half", "dep:tokenizers"]

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "embed_texts"
required-features = ["embed"]

[[example]]
name = "embed_timing"
required-features = ["embed"]

[[example]]
name = "dense_recall"
required-features = ["embed"]

[[example]]
name = "embed_check"
required-features = ["embed"]

[[example]]
name = "window_tokens"
required-features = ["embed"]

[[example]]
name = "flush_timing"
required-features = ["embed"]
