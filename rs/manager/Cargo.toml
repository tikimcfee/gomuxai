# The agent manager: a Makepad GUI over the agent crates. It is a workspace of its own, so
# Makepad stays out of the `agent` workspace's lock file, tests and lints.
[package]
name = "agent-manager"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace]
members = ["core"]

[dependencies]
agent-manager-core = { path = "core" }
agent-manage = { path = "../crates/agent-manage" }
chrono = "0.4"
serde_json = "1"
# Makepad, from the fork's tinybot/shell branch (upstream `work` plus the tinybot patches),
# pinned by commit.
makepad-widgets = { git = "https://github.com/tikimcfee/makepad", rev = "433a690091407fbd3379398e20fcc8e5120b51c2", default-features = false }

[profile.release]
opt-level = 2
strip = true

# For `makepad run` (Makepad's JIT, which runs the manager live): the JIT refuses a program whose
# Makepad crates build against other dependencies than its own build did. Makepad's workspace
# patches crates.io smallvec to its in-tree copy, which a git dependent doesn't inherit, so on
# Linux its wayland crates would otherwise take crates.io smallvec. Keep the rev in step with
# makepad-widgets above.
[patch.crates-io]
smallvec = { git = "https://github.com/tikimcfee/makepad", rev = "433a690091407fbd3379398e20fcc8e5120b51c2" }
